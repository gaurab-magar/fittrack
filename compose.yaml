
services:
  db:
    image: postgres:17
    container_name: fittrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: fittrack
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
